spring:
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5433/demo_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: ${APP_MULTIPART_MAX_FILE_SIZE:100MB}
      max-request-size: ${APP_MULTIPART_MAX_REQUEST_SIZE:100MB}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  user:
    default-id: ${APP_DEFAULT_USER_ID:soc-analyst-demo}
  elasticsearch:
    events-index: ${APP_EVENTS_INDEX:soc-events}
    initialize-index: ${APP_ELASTICSEARCH_INITIALIZE_INDEX:true}
  ingest:
    spool-root: ${APP_INGEST_SPOOL_ROOT:data/ingest}
    rate-limit:
      enabled: ${APP_INGEST_RATE_LIMIT_ENABLED:true}
      max-requests: ${APP_INGEST_RATE_LIMIT_MAX_REQUESTS:10}
      window-seconds: ${APP_INGEST_RATE_LIMIT_WINDOW_SECONDS:60}
  llm:
    summary-enabled: ${APP_LLM_SUMMARY_ENABLED:false}
    provider-order: ${APP_LLM_PROVIDER_ORDER:GEMINI,GROQ}
    gemini:
      model: ${GEMINI_MODEL:gemini-2.5-flash}
      api-key: ${GEMINI_API_KEY:}
    groq:
      model: ${GROQ_MODEL:llama-3.3-70b-versatile}
      api-key: ${GROQ_API_KEY:}
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1/chat/completions}
  search:
    schema-version: ${APP_SCHEMA_VERSION:v4}
    confirmation-ttl-seconds: ${APP_CONFIRMATION_TTL_SECONDS:900}
    cache-ttl-seconds: ${APP_QUERY_CACHE_TTL_SECONDS:3600}
