spring:
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5433/demo_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  servlet:
    multipart:
      max-file-size: ${APP_MULTIPART_MAX_FILE_SIZE:100MB}
      max-request-size: ${APP_MULTIPART_MAX_REQUEST_SIZE:100MB}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  user:
    default-id: ${APP_DEFAULT_USER_ID:soc-analyst-demo}
  elasticsearch:
    events-index: ${APP_EVENTS_INDEX:soc-events-v7}
    initialize-index: ${APP_ELASTICSEARCH_INITIALIZE_INDEX:true}
  ingest:
    spool-root: ${APP_INGEST_SPOOL_ROOT:data/ingest}
    rate-limit:
      enabled: ${APP_INGEST_RATE_LIMIT_ENABLED:true}
      max-requests: ${APP_INGEST_RATE_LIMIT_MAX_REQUESTS:10}
      window-seconds: ${APP_INGEST_RATE_LIMIT_WINDOW_SECONDS:60}
  llm:
    mode: ${APP_LLM_MODE:real}
    mock-fixture: ${APP_LLM_MOCK_FIXTURE:classpath:llm/mock-search-events.json}
    provider-order: ${APP_LLM_PROVIDER_ORDER:GPT,GEMINI,GROQ}
    circuit-breaker:
      threshold: ${APP_LLM_429_THRESHOLD:3}
      window-seconds: ${APP_LLM_429_WINDOW_SECONDS:60}
      cooldown-seconds: ${APP_LLM_429_COOLDOWN_SECONDS:60}
    gemini:
      model: ${GEMINI_MODEL:gemini-2.5-flash}
      api-key: ${GEMINI_API_KEY:${GOOGLE_API_KEY:}}
    groq:
      model: ${GROQ_MODEL:llama-3.3-70b-versatile}
      api-key: ${GROQ_API_KEY:}
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1/chat/completions}
    gpt:
      model: ${OPENAI_MODEL:gpt-4.1-mini}
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1/chat/completions}
  search:
    schema-version: ${APP_SCHEMA_VERSION:v7}
    cache-ttl-seconds: ${APP_QUERY_CACHE_TTL_SECONDS:3600}
    session-ttl-seconds: ${APP_SESSION_TTL_SECONDS:1800}
