services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.8
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
    volumes:
      - elasticsearch-data-v9:/usr/share/elasticsearch/data

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_DB=demo_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d demo_db"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  spring-boot-app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - POSTGRES_URL=jdbc:postgresql://postgres:5432/demo_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - ELASTICSEARCH_URIS=http://elasticsearch:9200
      - APP_EVENTS_INDEX=${APP_EVENTS_INDEX:-soc-events-v7}
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - APP_INGEST_SPOOL_ROOT=/app/data/ingest
      - APP_SCHEMA_VERSION=${APP_SCHEMA_VERSION:-v7}
      - APP_LLM_PROVIDER_ORDER=${APP_LLM_PROVIDER_ORDER:-GPT,GEMINI,GROQ}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4.1-mini}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - GROQ_BASE_URL=${GROQ_BASE_URL:-https://api.groq.com/openai/v1/chat/completions}
    volumes:
      - ./data/ingest:/app/data/ingest
    depends_on:
      elasticsearch:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  fluentd:
    build: ./fluentd
    environment:
      - ELASTICSEARCH_HOST=${ELASTICSEARCH_HOST:-elasticsearch}
      - ELASTICSEARCH_PORT=${ELASTICSEARCH_PORT:-9200}
      - ELASTICSEARCH_SCHEME=${ELASTICSEARCH_SCHEME:-http}
      - APP_EVENTS_INDEX=${APP_EVENTS_INDEX:-soc-events-v7}
    volumes:
      - ./data/ingest/incoming:/fluentd/incoming
      - fluentd-buffer:/fluentd/buffer
      - fluentd-pos:/fluentd/pos
    depends_on:
      elasticsearch:
        condition: service_healthy
      spring-boot-app:
        condition: service_started

volumes:
  elasticsearch-data:
  elasticsearch-data-v9:
  postgres-data:
  redis-data:
  fluentd-buffer:
  fluentd-pos:
