name: b-llm-only

services:
  elasticsearch:
    container_name: b-llm-only-elasticsearch
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.8
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
    volumes:
      - elasticsearch-data-v9:/usr/share/elasticsearch/data

  postgres:
    container_name: b-llm-only-postgres
    image: postgres:16
    environment:
      - POSTGRES_DB=demo_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d demo_db"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data

  spring-boot-app:
    container_name: b-llm-only-spring-boot-app
    build: .
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=postgres
      - POSTGRES_URL=jdbc:postgresql://postgres:5432/demo_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - ELASTICSEARCH_URIS=http://elasticsearch:9200
      - GOOGLE_API_KEY
      - GROQ_API_KEY
    depends_on:
      elasticsearch:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  elasticsearch-data-v9:
    name: b-llm-only-elasticsearch-data-v9
  postgres-data:
    name: b-llm-only-postgres-data
