<system>
  log_level info
</system>

<source>
  @type tail
  tag soc.events.jsonl
  path /fluentd/incoming/jsonl/*.jsonl
  pos_file /fluentd/pos/jsonl.pos
  read_from_head true
  follow_inodes true
  <parse>
    @type json
  </parse>
</source>

<source>
  @type tail
  tag soc.events.csv
  path /fluentd/incoming/csv/*.csv
  pos_file /fluentd/pos/csv.pos
  read_from_head true
  follow_inodes true
  <parse>
    @type csv
    keys timestamp,source,severity,event_type,user,host,ip,message,raw,advanced_metadata
    parser_type normal
  </parse>
</source>

<filter soc.events.csv>
  @type grep
  <exclude>
    key timestamp
    pattern /^timestamp$/
  </exclude>
</filter>

<filter soc.events.**>
  @type record_transformer
  enable_ruby true
  auto_typecast true
  renew_record true
  <record>
    timestamp ${record['timestamp']}
    source ${record['source'] || tag}
    severity ${record['severity']}
    event_type ${record['event_type']}
    user ${record['user']}
    host ${record['host']}
    ip ${record['ip']}
    geo_location ${metadata = record['advanced_metadata']; metadata = (JSON.parse(metadata) rescue metadata) if metadata.is_a?(String); metadata.is_a?(Hash) ? metadata['geo_location'] : record['geo_location']}
    user_agent ${metadata = record['advanced_metadata']; metadata = (JSON.parse(metadata) rescue metadata) if metadata.is_a?(String); metadata.is_a?(Hash) ? metadata['user_agent'] : record['user_agent']}
    message ${record['message'] || record['raw']}
    raw ${record['raw'] || record['message']}
    metadata ${record.reject { |key, _| ['timestamp', 'source', 'severity', 'event_type', 'user', 'host', 'ip', 'geo_location', 'user_agent', 'message', 'raw', 'advanced_metadata'].include?(key) }}
  </record>
</filter>

<match soc.events.**>
  @type elasticsearch
  host "#{ENV['ELASTICSEARCH_HOST'] || 'elasticsearch'}"
  port "#{ENV['ELASTICSEARCH_PORT'] || '9200'}"
  scheme "#{ENV['ELASTICSEARCH_SCHEME'] || 'http'}"
  index_name "#{ENV['APP_EVENTS_INDEX'] || 'soc-events'}"
  logstash_format false
  include_tag_key false
  reconnect_on_error true
  reload_on_failure true
  request_timeout 30s
  <buffer>
    @type file
    path /fluentd/buffer/elasticsearch
    flush_interval 5s
    retry_forever true
    chunk_limit_size 8m
  </buffer>
</match>
